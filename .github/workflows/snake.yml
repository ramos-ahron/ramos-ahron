name: snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2e5bd8&color_dots=#ebedf0,#c7d2fe,#a5b4fc,#7aa2f7,#2e5bd8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f7768e&color_dots=#151b23,#33467c,#5a6fbf,#7aa2f7,#bb9af7
      - name: Activity graph
        run: python3 .github/scripts/activity_graph.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
