name: profile graphics
on:
  schedule: [{ cron: "17 5 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Black and white, matching the stat graphics.
          outputs: |
            dist/github-snake.svg?color_snake=#000000&color_dots=#ebeef1,#c8d1da,#8c959f,#424a53,#000000
            dist/github-snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#3d444d,#6e7681,#b1bac4,#ffffff
      - name: Stat graphics
        run: python3 .github/scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT_DIR: dist
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
